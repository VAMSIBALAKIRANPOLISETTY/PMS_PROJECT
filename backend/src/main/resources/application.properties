spring.application.name=pms-backend
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pms_db}
spring.datasource.username=${DATABASE_USERNAME:pms_user}
spring.datasource.password=${DATABASE_PASSWORD:pms_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

pms.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
pms.demo.password=password123
pms.jwt.secret=${JWT_SECRET:pms-development-secret-change-before-production-2026}
pms.jwt.issuer=${JWT_ISSUER:PMS Health}
pms.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:12}
pms.ai.mode=${AI_MODE:mock}
pms.ai.provider=${AI_PROVIDER:}
pms.ai.api-key=${AI_API_KEY:}
pms.ai.model=${AI_MODEL:}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
