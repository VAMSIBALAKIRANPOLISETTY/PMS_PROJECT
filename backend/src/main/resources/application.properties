spring.application.name=pms-backend
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pms_db}
spring.datasource.username=${DATABASE_USERNAME:pms_user}
spring.datasource.password=${DATABASE_PASSWORD:pms_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

pms.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
pms.demo.password=password123
pms.jwt.secret=${JWT_SECRET:pms-development-secret-change-before-production-2026}
pms.jwt.issuer=${JWT_ISSUER:PMS Health}
pms.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:12}
pms.ai.mode=${AI_MODE:mock}
pms.ai.provider-chain=${AI_PROVIDER_CHAIN:ollama,openai}
pms.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}
pms.ai.temperature=${AI_TEMPERATURE:0.2}
pms.ai.ollama.api-key=${OLLAMA_API_KEY:}
pms.ai.ollama.model=${OLLAMA_MODEL:gemma4:31b}
pms.ai.ollama.base-url=${OLLAMA_BASE_URL:https://ollama.com/api}
pms.ai.openai.api-key=${OPENAI_API_KEY:${AI_API_KEY:}}
pms.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
pms.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
pms.connected-health.frontend-url=${CONNECTED_HEALTH_FRONTEND_URL:http://localhost:5173}
pms.connected-health.secret=${CONNECTED_HEALTH_SECRET:${JWT_SECRET:pms-development-secret-change-before-production-2026}}
pms.connected-health.google.client-id=${GOOGLE_HEALTH_CLIENT_ID:}
pms.connected-health.google.client-secret=${GOOGLE_HEALTH_CLIENT_SECRET:}
pms.connected-health.google.redirect-uri=${GOOGLE_HEALTH_REDIRECT_URI:http://localhost:8080/api/connections/google-health/callback}
pms.connected-health.google.authorization-base-url=${GOOGLE_HEALTH_AUTH_BASE_URL:https://accounts.google.com/o/oauth2/v2/auth}
pms.connected-health.google.token-url=${GOOGLE_HEALTH_TOKEN_URL:https://oauth2.googleapis.com/token}
pms.connected-health.google.api-base-url=${GOOGLE_HEALTH_API_BASE_URL:https://www.googleapis.com/fitness/v1}
pms.connected-health.google.user-info-url=${GOOGLE_HEALTH_USER_INFO_URL:https://openidconnect.googleapis.com/v1/userinfo}
pms.connected-health.google.timeout-seconds=${GOOGLE_HEALTH_TIMEOUT_SECONDS:20}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
